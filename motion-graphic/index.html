<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#04070E" />
<meta name="description" content="موشن‌گرافی پیام مدیریت حمل‌ونقل داخلی گهرترابر — همدلی، همت، تلاشگری" />
<title>گهرترابر · همدلی، همت، تلاشگری</title>
<link rel="preload" href="assets/fonts/Vazirmatn-var.woff2" as="font" type="font/woff2" crossorigin />
<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
<div class="app" id="app" data-state="idle">

  <!-- ambient background -->
  <div class="ambient" aria-hidden="true">
    <span class="blob blob-a"></span>
    <span class="blob blob-b"></span>
    <span class="blob blob-c"></span>
    <span class="beam"></span>
    <div class="grain"></div>
    <div class="vignette"></div>
  </div>

  <!-- the 9:16 stage -->
  <div class="stage-host" id="stageHost">
    <div class="stage" id="stage">

      <header class="hud">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" fill="none">
              <path d="M16 3.4 27 9.2v13.6L16 28.6 5 22.8V9.2z" stroke="currentColor" stroke-width="1.4" opacity=".55"/>
              <path d="M9.5 17.6h8.2v4.6H9.5z" fill="currentColor" opacity=".95"/>
              <path d="M17.7 19.6h2.9l2.1 1.9v.7h-5z" fill="currentColor" opacity=".8"/>
              <circle cx="12" cy="23.2" r="1.35" fill="currentColor"/>
              <circle cx="20.4" cy="23.2" r="1.35" fill="currentColor"/>
              <path d="M9.5 12.4h9.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" opacity=".9"/>
            </svg>
          </span>
          <span class="brand-text">
            <b>گهرترابر</b>
            <i>چرخه حمل‌ونقل داخلی</i>
          </span>
        </div>

        <div class="hud-left">
          <div class="counter" aria-hidden="true">
            <span class="c-now" id="cNow">۰۱</span>
            <span class="c-sep">/</span>
            <span class="c-all" id="cAll">۱۰</span>
          </div>
        </div>
      </header>

      <div class="progress" id="progress" role="tablist" aria-label="فصل‌ها"></div>

      <main class="scenes" id="scenes"></main>

      <footer class="caption-bar">
        <div class="caption-line" aria-hidden="true"></div>
        <p class="caption" id="caption" aria-live="polite"></p>
      </footer>

      <div class="particles" id="particles" aria-hidden="true"></div>

      <div class="stage-ornament" aria-hidden="true">
        <span class="orn orn-tl"></span>
        <span class="orn orn-br"></span>
      </div>

      <button class="stage-tap" id="stageTap" aria-label="پخش یا توقف"></button>
    </div>
  </div>

  <!-- controls -->
  <div class="dock" id="dock" data-visible="true">
    <div class="dock-inner">
      <button class="ctl ctl-play" id="btnPlay" aria-label="پخش">
        <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 5.2v13.6L19.4 12z" fill="currentColor"/></svg>
        <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="5" width="3.6" height="14" rx="1.2" fill="currentColor"/><rect x="13.4" y="5" width="3.6" height="14" rx="1.2" fill="currentColor"/></svg>
      </button>

      <div class="timeline" id="timeline" role="slider" aria-label="زمان‌بندی" tabindex="0" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="tl-track"><div class="tl-buffer"></div><div class="tl-fill" id="tlFill"></div></div>
        <div class="tl-head" id="tlHead"></div>
      </div>

      <span class="time" id="time" aria-hidden="true">۰۰:۰۰ / ۰۰:۰۰</span>

      <button class="ctl" id="btnSound" aria-label="صدا">
        <svg class="i-vol" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.3h3.4L12 5.6v12.8L7.4 14.7H4z" fill="currentColor"/><path d="M15.4 9.2a3.9 3.9 0 0 1 0 5.6M17.9 6.6a7.5 7.5 0 0 1 0 10.8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" fill="none"/></svg>
        <svg class="i-mute" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.3h3.4L12 5.6v12.8L7.4 14.7H4z" fill="currentColor"/><path d="m16 9.5 5 5m0-5-5 5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" fill="none"/></svg>
      </button>

      <button class="ctl" id="btnFull" aria-label="تمام‌صفحه">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.2V4h5.2M20 14.8V20h-5.2M15.2 4H20v5.2M8.8 20H4v-5.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>

  <!-- start / end veil -->
  <div class="veil" id="veil" data-mode="start">
    <div class="veil-card">
      <div class="veil-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none">
          <path d="M16 3.4 27 9.2v13.6L16 28.6 5 22.8V9.2z" stroke="currentColor" stroke-width="1.2" opacity=".5"/>
          <path d="M9.5 17.6h8.2v4.6H9.5z" fill="currentColor"/>
          <path d="M17.7 19.6h2.9l2.1 1.9v.7h-5z" fill="currentColor" opacity=".85"/>
          <circle cx="12" cy="23.2" r="1.35" fill="currentColor"/>
          <circle cx="20.4" cy="23.2" r="1.35" fill="currentColor"/>
          <path d="M9.5 12.4h9.4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" opacity=".85"/>
        </svg>
      </div>
      <p class="veil-kicker">گهرترابر · حمل‌ونقل داخلی</p>
      <h1 class="veil-title">پیام مدیریت<br />حمل‌ونقل داخلی</h1>
      <p class="veil-sub">همدلی، همت، تلاشگری</p>
      <button class="veil-btn" id="btnStart">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 5.2v13.6L19.4 12z" fill="currentColor"/></svg>
        <span>پخش موشن‌گرافی</span>
      </button>
      <p class="veil-hint">برای شنیدن روایت، صدا را روشن کنید · حدود ۳ دقیقه</p>
    </div>
  </div>

</div>

<script src="assets/js/app.js" defer></script>
</body>
</html>
